<!DOCTYPE html>
<html lang="ptbr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="loja.css">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="./pictures/logo.png" type="image/x-icon">
    <title>SOBRE</title>
</head>

<body>
    <!–CRIAÇÃO DA MINHA NAVBAR PARA A NAVEGAÇÃO DO CLIENTE->
        <header class="header">
            <section>
                <a href="site.html" class="logo">
                    <img src="./pictures/logo.png" width="130px" alt="logo">
                </a>

                <nav class="navbar">
                    <a href="site.html">HOME</a>
                    <a href="loja.html">SHOP ALL</a>
                    <a href="sac.html">SAC</a>
                    <a href="sobre.html">SOBRE</a>
                </nav>

                <div class="icons">
                    <!--Icone de pesquisa que inicialmente é "fechado"-->
                    <a href= "#" id = "search-box">
                    <img width="30" height="30" src="https://img.icons8.com/ios/30/search--v1.png" alt="search--v1" />
                     </a>
                      <!--Icone de pesquisa abrindo...-->
    
                      <div id = "search-container" style="display: none;">
                        <input type="text" id="search-input" placeholder="Digite sua busca..."/>
                        <button id="search-btn">Buscar</button>
                      </div>
    
    
                    <a href="#" id="open-cart">
                        <img width="30" height="30" src="https://img.icons8.com/ios-glyphs/30/shopping-cart--v1.png"
                            alt="shopping-cart--v1" />
                    </a>
                </div>
            </section>
            <!-- CARRINHO DE COMPRAS -->
            <div class="cart">
                <h2 class="cart-title">CARRINHO DE COMPRA</h2>
                <div class="cart-content">

                </div>

                <div class="total">
                    <div class="total-title">Total</div>
                    <div class="total-price">R$200,00</div>
                </div>
                <!--botao de comprar-->
                <button type="button" class="btn-buy">Compre agora</button>
                <!--botao de fechar-->
                <i class='bx bx-x' id="close-cart"></i>
            </div>
            

            <script src="./scripts/loja.js"></script>
            <script src="scripts/procura.js"></script>
</body>

</html>
